<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portfolio | Unreal & Full Stack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link href="./css/globalStyles.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: black;
            overflow-x: hidden;
            margin: 0;
            color: white;
        }

        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        
        .side {
            position: relative;
            flex: 1;
            transition: flex 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        
        /* Hover expansion logic */
        @media (min-width: 769px) {
            .side:hover {
                flex: 1.5;
            }
        }
        
        .side-fullstack {
            background-color: var(--matrix-black);
            border-right: 1px solid var(--matrix-dark-green);
        }
        
        .side-fullstack::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0, 255, 65, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }
        
        .matrix-text {
            font-family: 'Fira Code', monospace;
            color: var(--matrix-bright-green);
            text-shadow: 0 0 8px var(--matrix-medium-green);
        }
        
        .side-unreal {
            background-color: var(--unreal-dark);
            border-left: 1px solid var(--unreal-blue);
        }
        
        .unreal-gradient {
            background: radial-gradient(circle at center, rgba(0, 112, 243, 0.15) 0%, transparent 70%);
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
        }
        
        .central-hero {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }
        
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }
            .central-hero {
            position: absolute;
            top: 50%;
            left: 50%;
            }
        }

        .hero-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
            transition: all 0.3s ease;
        }

        .view-content {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            background: black;
            overflow-y: auto;
        }

        /* Overlay transition effect for navigation */
        .page-transition-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .page-transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .nav-back {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 200;
            background: white;
            color: black;
            padding: 0.5rem 1.5rem;
            border-radius: 99px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .nav-back:hover {
            transform: scale(1.05);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.8s ease forwards;
        }
    </style>
</head>
<body>

    <div id="transition-overlay" class="page-transition-overlay"></div>

    <div id="gateway-view">
        <div class="central-hero">
            <div class="hero-badge animate-fade">
                <h1 class="text-4xl md:text-6xl font-black mb-2 tracking-tighter">ALEXIS</h1>
                <p class="text-sm md:text-base opacity-80 uppercase tracking-widest">Frontend & Unreal Engine Developer</p>
            </div>
        </div>

        <div class="split-container">
            <!-- Lado Full Stack -->
            <div class="side side-fullstack" onclick="openPortfolio('fullstack')">
                <div class="text-center z-10 px-6">
                    <h2 class="matrix-text text-3xl md:text-5xl font-bold mb-4">FRONTEND</h2>
                    <p class="matrix-text opacity-70 text-xs md:text-sm">INDEX.HTML</p>
                </div>
            </div>

            <!-- Lado Unreal -->
            <div class="side side-unreal" onclick="openPortfolio('unreal')">
                <div class="unreal-gradient"></div>
                <div class="text-center z-10 px-6">
                    <h2 class="text-3xl md:text-5xl font-bold mb-4 text-white uppercase tracking-tighter">Unreal Engine</h2>
                    <p class="text-blue-400 opacity-70 text-xs md:text-sm tracking-widest font-bold">LAUNCH_ENGINE.SH</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Vista temporal para Full Stack (hasta que tengas el archivo separado) -->
    <div id="fullstack-view" class="view-content" style="background-color: var(--matrix-black);">
        <button class="nav-back" onclick="closePortfolios()"> VOLVER AL INICIO > </button>
        <div class="max-w-5xl mx-auto py-20 px-10">
            <h1 class="matrix-text text-6xl font-bold mb-8">System: Full Stack</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="border border-[var(--matrix-dark-green)] p-6 rounded-lg hover:bg-[var(--matrix-dark-green)] transition-all">
                    <h3 class="matrix-text text-2xl mb-2">> E-Commerce API</h3>
                    <p class="text-[var(--matrix-medium-green)] mb-4">Node.js, React, PostgreSQL.</p>
                </div>
                <div class="border border-[var(--matrix-dark-green)] p-6 rounded-lg hover:bg-[var(--matrix-dark-green)] transition-all">
                    <h3 class="matrix-text text-2xl mb-2">> Dashboard Analytics</h3>
                    <p class="text-[var(--matrix-medium-green)] mb-4">Python, Django, D3.js.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openPortfolio(type) {
            if (type === 'unreal') {
                // Efecto de transición antes de navegar
                const overlay = document.getElementById('transition-overlay');
                overlay.classList.add('active');
                
                // Pequeño retraso para que la transición se vea fluida
                setTimeout(() => {
                    window.location.href = './pages/PaginaUnreal.html';
                }, 500);
                
            } else {
                // Lógica interna para Full Stack
                document.getElementById('gateway-view').style.display = 'none';
                const view = document.getElementById(type + '-view');
                view.style.display = 'block';
                view.classList.add('animate-fade');
            }
            
            console.log("Navegando al espacio de: " + type);
        }

        function closePortfolios() {
            document.getElementById('fullstack-view').style.display = 'none';
            document.getElementById('gateway-view').style.display = 'block';
        }

        window.addEventListener('resize', () => {
            console.log("Vista ajustada.");
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/calculadoraStyles.css">
</head>
<body>

    <main>
        <div class="calculator-container">
            <div class="display-container" id="display">
            </div>
            <div class="buttons-container">
                <button class="btn clear">AC</button>
                <button class="btn operator">/</button>
                <button class="btn operator">*</button>
                <button class="btn operator">DEL</button>
                
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="btn operator">-</button>

                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn operator">+</button>

                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn equal">=</button>
                <button class="btn cero">0</button>
            </div>
        </div>
        <button class="btn-volver" id="volver">VOLVER</button>
    </main>
    <script type="module" src="js/calculadoramain.js"></script>
</body>
</html>
